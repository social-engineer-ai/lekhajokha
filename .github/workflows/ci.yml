name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lekhajokha
          POSTGRES_PASSWORD: lekhajokha_dev
          POSTGRES_DB: lekhajokha
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://lekhajokha:lekhajokha_dev@localhost:5432/lekhajokha_test
      OTP_MOCK: "true"
      OCR_ENGINE: mock
      TWILIO_MOCK: "true"
      SMTP_MOCK: "true"
      CASHFREE_MOCK: "true"
      DEBUG: "false"
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: http://localhost:9000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev poppler-utils libgl1 libglib2.0-0

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create test database
        run: psql -c "CREATE DATABASE lekhajokha_test;"
        env:
          PGHOST: localhost
          PGUSER: lekhajokha
          PGPASSWORD: lekhajokha_dev

      - name: Run tests
        run: pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing -v --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
